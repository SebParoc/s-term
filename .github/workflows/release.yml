name: Release

# Pushing a tag such as v0.1.0 builds the Linux tarball and attaches it to a GitHub Release of that
# name. Run it by hand (Actions → Release → Run workflow) to get the tarball as a build artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Built on an older distro so the binary runs on any Linux with glibc 2.35 or newer
    # (Ubuntu 22.04+, Debian 12+, Fedora 36+). A binary needs its build machine's glibc or newer.
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Build the tarball
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: s-term-linux
          path: dist/*.tar.gz*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz*
          generate_release_notes: true
