[package]
name = "s-term"
version = "0.1.0"
edition = "2021"
description = "S-term: a terminal for vibe coding, with Terminator-style splits"
license = "MIT"

[[bin]]
name = "s-term"
path = "src/main.rs"

[dependencies]
# Terminal emulation core (VT parser, grid, scrollback, PTY + IO event loop)
alacritty_terminal = "0.24"
# Window + GPU rendering + input
eframe = "0.29"
egui = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read Antigravity CLI conversation databases (read-only)
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
# Decode images for the file viewer
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[profile.release]
opt-level = 3
lto = "thin"

# Keep our own crate quick to compile, but make the dependencies fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
