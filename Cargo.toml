[package]
name = "s-term"
version = "0.1.0"
edition = "2021"
description = "S-term: a terminal for vibe coding, with Terminator-style splits"
license = "MIT"

[[bin]]
name = "s-term"
path = "src/main.rs"

[dependencies]
# The look (themes, glass, icons, fonts, the scorpion mark, window chrome) is its own repo, shared
# with S-study: clone https://github.com/SebParoc/s-style next to this one.
s-style = { path = "../s-style" }
# Terminal emulation core (VT parser, grid, scrollback, PTY + IO event loop)
alacritty_terminal = "0.24"
# Window + GPU rendering + input
eframe = "0.29"
egui = "0.29"
# Already in the tree through egui: checks that a system font parses and has a glyph before egui gets it
ab_glyph = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read Antigravity CLI conversation databases (read-only)
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
# Decode images for the file viewer
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
ureq = { version = "2", features = ["json"] }
egui_commonmark = "0.18"

[profile.release]
opt-level = 3
lto = "thin"

# Keep our own crate quick to compile, but make the dependencies fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
